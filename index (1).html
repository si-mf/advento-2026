<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jornada até o Natal</title>
<style>
:root{--night:#14305A;--gold:#F7B538;--cream:#FBE3DC;--ink:#2a1a22;--mute:#7a5c68;--line:#e9b8c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#2b1030;color:var(--ink);font-family:Helvetica,Arial,sans-serif;font-size:15px}
body{max-width:640px;margin:0 auto;min-height:100vh;background:#3d1738}
.serif{font-family:Georgia,'Times New Roman',serif}
header{background:linear-gradient(#14305A,#2c2a63);color:#fff;padding:20px 16px 14px;text-align:center;border-bottom:4px solid var(--gold)}
header .st{color:var(--gold);font-size:22px}
h1{margin:2px 0 0;font-size:30px;font-weight:700}
.sub{font-size:12px;color:#c9d6ee;margin-top:4px}
.me{display:flex;align-items:center;gap:10px;margin-top:14px;background:rgba(255,255,255,.1);border-radius:30px;padding:6px 14px 6px 6px;text-align:left;cursor:pointer}
.me b{display:block}.me small{color:#c9d6ee}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;border:2px solid #fff}
.pb{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;flex:1;margin-top:6px}
.pb i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.tabs{display:flex;position:sticky;top:0;z-index:3;background:#3d1738}
.tabs button{flex:1;border:0;background:none;color:#e9c7da;padding:13px;font:inherit;font-weight:700;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-color:var(--gold)}
main{padding:12px}
.wk{border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--cream)}
.wh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff}
.wh h2{margin:0;font-size:22px}
.wh span{background:var(--tag);padding:4px 12px;border-radius:4px;font-weight:700;font-size:13px}
.day{display:grid;grid-template-columns:1fr 34px;gap:10px;padding:12px 14px;border-top:2px solid var(--tag)}
.day.today{background:#fff3cc}
.day.done .q{opacity:.55}
.day.lock{opacity:.6}
.lkt{font-size:12px;color:var(--mute);margin-top:4px;font-weight:700}
.dh{font-size:12px;font-weight:700;text-transform:uppercase}
.dh a{color:var(--ink)}
.q{margin-top:4px;line-height:1.4}
.day input{width:32px;height:32px;accent-color:#c2185b;margin:0}
.card{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card.you{outline:3px solid var(--gold)}
.card .in{flex:1;min-width:0}
.card .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:9px;background:#fff;border-radius:5px;overflow:hidden;margin:5px 0 4px}
.bar i{display:block;height:100%}
.fl{font-size:12px;color:var(--mute)}
.fl s{text-decoration:none;opacity:.25;filter:grayscale(1)}
.note{background:#fff3cc;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.ob{padding:22px 16px;color:#fff}
.ob h2{text-align:center;margin:0 0 4px;font-size:26px}
.ob p{text-align:center;color:#e9c7da;margin:0 0 16px}
.ob label{display:block;font-weight:700;margin:14px 0 6px}
.ob input[type=text]{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:8px;border:0}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:50%;border:3px solid transparent;font-size:22px;padding:0;background:#fff}
.grid button.on{border-color:var(--gold);transform:scale(1.1)}
.prev{display:flex;justify-content:center;margin:16px 0}
.prev .av{width:84px;height:84px;font-size:46px}
.go{width:100%;font:inherit;font-weight:700;font-size:17px;padding:14px;border:0;border-radius:8px;background:var(--gold);color:#2a1a22}
.go:disabled{opacity:.4}
.vs{text-align:center;color:#e9c7da;font-size:12px;margin:8px 0 24px}
.vid{display:block;background:var(--tag);color:#fff;text-align:center;padding:12px;font-weight:700;text-decoration:underline}
.logo{display:block;margin:0 auto 12px;width:150px;height:auto;border-radius:10px}
.intro{background:var(--cream);border-radius:10px;padding:16px;margin-bottom:16px;line-height:1.6;font-size:15px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.ft{text-align:center;padding:18px 16px 30px;color:#e9c7da;font-size:12px;line-height:1.5}
.ft .logo{margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>

Romanos 8:24-25|ROM.8.24-25|O que significa, na prática, esperar em Deus de forma ativa e paciente neste momento da sua vida?

João 13:34-35|JHN.13.34-35|Como seria amar os outros da mesma maneira que Jesus ama você?
Lucas 6:35|LUK.6.35|Como você se sente ao ler histórias sobre Deus demonstrando bondade para com pessoas que parecem não merecê-la?

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ON=API.startsWith('https://');
let tab='me',edit=false,people=[],mode=ON?'online':'local',tmp={},last=null;

const dt=i=>new Date(2026,10,29+i);
const fd=i=>dt(i).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

let tmr;
function push(){if(!ON||!S.name)return;clearTimeout(tmr);tmr=setTimeout(async()=>{try{await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pid:S.pid,sec:S.sec,nome:S.name,emoji:S.emoji,cor:S.color,dias:S.done})})}catch(e){mode='err'}pull()},800)}
async function pull(){if(!ON)return;try{const r=await fetch(API+'?t='+Date.now());const j=await r.json();people=Array.isArray(j.people)?j.people:[];last=new Date();mode='online'}catch(e){mode='err'}if(!edit)render()}

 if(!S.name||edit){const t=edit?tmp:S;tmp=Object.assign({},t);return onboard()}

 let h='<header><img class="logo" src="'+LOGO+'" alt="BibleProject Português Brasil"><div class="st">✦</div><h1 class="serif">Jornada até o Natal</h1><div class="sub">Advento 2026 · 29 de novembro a 25 de dezembro</div><div class="me" id="ed">'+av(S.emoji,S.color)+'<div style="flex:1"><b>'+esc(S.name)+'</b><small>'+n+' de '+N+' dias · toque para editar</small><div class="pb"><i style="width:'+n/N*100+'%"></i></div></div></div></header>';
 h+='<div class="tabs"><button data-t="me" class="'+(tab==='me'?'on':'')+'">Meu checklist</button><button data-t="all" class="'+(tab==='all'?'on':'')+'">Turma</button></div><main>';

}
function mine(){let h='<div class="intro">A palavra “advento” vem do latim <i>adventus</i>, que significa “vinda” ou “chegada”. Durante o Advento, relembramos a primeira vinda de Jesus à história e aguardamos Seu retorno, quando Ele renovará toda a criação. O Advento molda nossas comunidades para orar, doar e adorar enquanto aprendemos a esperar com expectativa. Essa época nos ensina a lamentar as rupturas do mundo, a praticar o amor generoso e a viver como pessoas moldadas pelo futuro de Deus. Acendemos velas, lemos as Escrituras e preparamos nosso coração para a história de Deus vindo habitar entre a humanidade. Faça esta jornada conosco durante o Advento por meio destas leituras diárias das Escrituras e perguntas para reflexão.</div>';W.forEach(w=>{h+='<section class="wk" style="--tag:'+w[2]+'"><div class="wh" style="background:'+w[1]+'"><h2 class="serif">'+w[0]+'</h2><span>Semana '+(W.indexOf(w)+1)+'</span></div><a class="vid" target="_blank" rel="noopener" href="'+VID[W.indexOf(w)]+'">▶ '+w[0]+': assista ao vídeo da semana</a>';
 for(let i=w[3];i<w[4];i++){const d=D[i],ok=S.done.includes(i),lk=i>todayI;
  h+='<label class="day'+(ok?' done':'')+(i===todayI?' today':'')+(lk?' lock':'')+'"><div><div class="dh">Dia '+(i+1)+', '+fd(i)+' | <a target="_blank" rel="noopener" href="https://www.bible.com/bible/129/'+d[1]+'.NVI">'+d[0]+'</a></div><div class="q">'+d[2]+'</div>'+(lk?'<div class="lkt">Libera em '+dt(i).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+'</div>':'')+'</div>'+(lk?'<span style="font-size:22px">🔒</span>':'<input type="checkbox" data-i="'+i+'"'+(ok?' checked':'')+'>')+'</label>'}
 h+='</section>'});return h}
function group(){
 let h='';
 if(mode==='local')h+='<div class="note">A turma ainda não está conectada. Peça ao líder o link atualizado. Seu progresso fica salvo neste aparelho.</div>';
 if(mode==='err')h+='<div class="note">Não foi possível falar com a planilha agora. Seu progresso fica salvo neste aparelho e será enviado na próxima atualização.</div>';
 if(ON)h+='<div class="fl" style="color:#e9c7da;margin-bottom:10px">'+(last?'Atualizado às '+last.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · ':'')+'atualiza sozinho a cada 30 minutos <button id="rf" style="margin-left:6px">Atualizar agora</button></div>';

function onboard(){

 const gr=(id,arr,key,f)=>{const g=document.getElementById(id);g.innerHTML=arr.map(v=>'<button data-v="'+v+'" class="'+(tmp[key]===v?'on':'')+'" style="'+(key==='color'?'background:'+v:'')+'">'+(key==='emoji'?v:'')+'</button>').join('');

}
render();

setInterval(pull,30*60*1000);
</script>
